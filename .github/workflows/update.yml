name: Update sector flow data

on:
  schedule:
    # 22:30 UTC = 07:30 JST (火〜土) … 米国市場の終了（16:00 ET = 20:00/21:00 UTC）後に実行
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices and compute sector / stock flows
        run: python scripts/fetch.py

      - name: Fetch market-wide indicators (ETF, FRED, ICI, FINRA, CFTC, AAII, Cboe)
        if: ${{ !cancelled() }}
        run: python scripts/market.py

      - name: Portfolio watch (watchlist.txt -> options / momentum / risk flags)
        if: ${{ !cancelled() }}
        run: python scripts/portfolio.py

      - name: Commit updated data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          # push with retry (GitHub occasionally answers "fatal error in commit_refs")
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i), retrying in 30s..."
            sleep 30
            git pull --rebase --autostash || true
          done
          echo "push failed after 3 attempts"; exit 1
